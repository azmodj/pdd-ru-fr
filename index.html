<style>
/* VOICE: sobre, pratique, comme un terminal d'examen du ГИБДД
   IDEA: la plaque de panneau routier russe — bleu de signalisation, bord blanc, chiffres nets
   PICTURE: la carte-question elle-même (image, question, réponses) en haut de l'écran
   COLOUR and TYPE: blanc, bleu panneau #1b4f9c, rouge #d7261e pour les fautes, vert pour les bonnes; PT Sans (cyrillique) + PT Sans Narrow
   LAYOUT: barre bleue, une colonne de 780px, grille de 40 billets, réponses empilées */
@font-face{font-family:"Affiche";src:url(fonts/affiche-latin.woff) format("woff");unicode-range:U+0020-017F,U+2013-2026,U+00AB,U+00BB;font-display:swap}
@font-face{font-family:"Affiche";src:url(fonts/titre-cond.woff) format("woff");unicode-range:U+0400-045F,U+2116;font-display:swap}
@font-face{font-family:"Titre";src:url(fonts/titre-cond.woff) format("woff");font-weight:700;font-display:swap}
:root{color-scheme:dark;--night:#10162E;--slate:#202B43;--cream:#F4EEE6;--amber:#FFB366;--green:#58D89B;--coral:#FF7772;
--fc:"Titre","PT Sans Narrow","Arial Narrow",sans-serif;--fb:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
--bg:var(--night);--ink:var(--cream);--mut:#A9B2C7;--blue:var(--amber);--blue2:#2A3654;--line:#34415F;--red:var(--coral);--redbg:#3B2233;--grn:var(--green);--grnbg:#16362F;--card:var(--slate);--fr:#A9C6F5;--yel:var(--amber)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--fb);overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #f2b705;outline-offset:2px}
.top{background:var(--blue);color:#fff;padding:10px max(4vw,14px);display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:5}
.plate{border:2px solid #fff;border-radius:6px;padding:2px 8px;font:700 20px/1.2 var(--fc);background:none;color:#fff}
.top .sp{flex:1}
.tbtn{background:none;border:1.5px solid #fff;color:#fff;border-radius:8px;min-height:38px;padding:0 12px;font-size:14px}
main{max-width:780px;margin:0 auto;padding:18px max(4vw,14px) 60px}
h1{font:700 clamp(30px,6vw,44px)/1.05 var(--fc);margin:8px 0 4px;text-wrap:balance}
h2{font:700 22px/1.2 var(--fc);margin:24px 0 10px}
.sub{color:var(--mut);margin:0 0 16px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
.stat{border-top:3px solid var(--blue);padding:8px 2px}
.stat b{display:block;font:700 28px/1 var(--fc)}
.stat b small{font-size:16px}
.stat span{color:var(--mut);font-size:13px}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mode{background:var(--blue2);border:0;border-radius:12px;padding:14px;text-align:left;min-height:76px}
.mode b{display:block;font-size:17px}.mode span{color:var(--mut);font-size:14px}
.mode.main{background:var(--blue);color:#fff}.mode.main span{color:#d6e2f5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.tk{aspect-ratio:1;border:2px solid var(--line);background:var(--card);border-radius:10px;font:700 20px var(--fc);position:relative}
.tk small{position:absolute;bottom:4px;left:0;right:0;font:400 11px var(--fb);color:var(--mut)}
.tk.ok{border-color:var(--grn);background:var(--grnbg)}.tk.ko{border-color:var(--red);background:var(--redbg)}.tk.go{border-color:var(--amber);background:#3A2C1E}
.tk i{position:absolute;top:3px;right:5px;font:700 11px var(--fb);font-style:normal;color:var(--mut)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--mut);margin:0 0 14px}.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.pend{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}.pend button{border:2px solid var(--amber);background:#3A2C1E;border-radius:10px;min-height:44px;padding:0 14px;font-weight:700}
.list button{display:flex;width:100%;justify-content:space-between;gap:10px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px;min-height:52px}
.list small{color:var(--mut);white-space:nowrap}
.btn{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:0 18px;min-height:46px;font-weight:700}
.btn.ghost{background:none;color:var(--fr);border:2px solid var(--fr)}

.qorig{background:var(--blue2);border-radius:12px;padding:8px 12px;margin:0 0 12px;display:grid;gap:0;font-size:15px;line-height:1.35}

.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
#app.swl{animation:swl .25s ease-out}#app.swr{animation:swr .25s ease-out}
@keyframes swl{from{transform:translateX(40px);opacity:.3}}@keyframes swr{from{transform:translateX(-40px);opacity:.3}}
.updbar{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:90;border:0;border-radius:14px;min-height:52px;background:#1f8a3b;color:#fff;font-weight:700;font-size:16px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.langmenu{position:fixed;z-index:95;display:grid;gap:4px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.langmenu button{min-width:190px;min-height:44px;border:0;border-radius:8px;background:none;color:var(--ink);font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px;padding:0 12px;text-align:left}

#langbtn{display:inline-flex;align-items:center;gap:5px;padding:0 9px}#langbtn svg{width:17px;height:17px;flex:none}#langbtn .fl{font-size:19px;line-height:1}
.langmenu button.on{background:var(--blue2);color:var(--blue)}
body.rtl .fr,body.rtl .kw li span,body.rtl .vm .col.f button,body.rtl .wtip,body.rtl .expl,body.rtl p,body.rtl li{unicode-bidi:plaintext}

.favb[aria-pressed=true]{border-color:#f5b400;background:light-dark(#fff6d6,#2e2814)}.favb[aria-pressed=true] path{fill:#ffc61a;stroke:#d99a00}
@media(prefers-reduced-motion:no-preference){.favb.pop svg{animation:favpop .45s cubic-bezier(.3,1.8,.5,1)}@keyframes favpop{0%{transform:scale(.4) rotate(-30deg)}}}
.qhead .t{font:700 18px var(--fc);flex:1}
.timer{font:700 18px var(--fc);font-variant-numeric:tabular-nums;color:var(--fr)}
.strip{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.strip button{flex:none;width:34px;height:34px;border-radius:6px;border:1.5px solid var(--line);background:var(--card);font-size:13px;padding:0}
.strip .cur{border-color:var(--blue);border-width:3px;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--blue);font-weight:700}.strip{padding:5px 4px 8px;scroll-padding:0 40%}
.strip .ok{background:var(--grn);color:#fff;border-color:var(--grn)}.strip .ko{background:var(--red);color:#fff;border-color:var(--red)}
.pic{border-radius:10px;overflow:hidden;background:#000;margin-bottom:14px;aspect-ratio:604/225}
.pic img{display:block;width:100%;height:auto}
.q{font-size:19px;font-weight:700;line-height:1.35;margin:0}
.fr{color:var(--fr);font-style:italic}
.qfr{font-size:17px;margin:6px 0 0}
.frbtn{display:inline-flex;align-items:center;gap:8px;margin-top:10px;background:var(--blue2);border:0;border-radius:999px;padding:0 16px;min-height:40px;font-size:15px;font-weight:700;color:var(--fr)}
.frbtn[aria-pressed=true]{background:var(--fr);color:var(--bg)}
.ans{display:grid;gap:8px;margin:16px 0}
.ans button{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:10px 12px;min-height:52px;align-items:start}
.ans .n{width:28px;height:28px;border-radius:50%;background:var(--blue2);display:grid;place-items:center;font-weight:700;font-size:14px}
.ans .fr{display:block;font-size:15px;margin-top:3px}
.ans button.ok{border-color:var(--grn);background:var(--grnbg)}.ans button.ok .n{background:var(--grn);color:#fff}
.ans button.ko{border-color:var(--red);background:var(--redbg)}.ans button.ko .n{background:var(--red);color:#fff}
.ans button:disabled{cursor:default}
.ans button.sel{border-color:var(--blue);background:var(--blue2)}.ans button.sel .n{background:var(--blue);color:#fff}
.strip .sel{background:var(--blue2);border-color:var(--blue);color:var(--ink)}
.tip{border-left:4px solid var(--blue);background:var(--blue2);padding:12px 14px;border-radius:0 10px 10px 0;font-size:15px}
.tip p{margin:0 0 8px}.tip p:last-child{margin:0}
.tip button{background:none;border:1.5px solid var(--fr);color:var(--fr);border-radius:8px;min-height:36px;padding:0 10px;font-size:14px}
.kw{margin-top:18px;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.kw h3{margin:0;padding:10px 14px;background:var(--yel);font:700 17px var(--fc)}
.kw ul{list-style:none;margin:0;padding:4px 14px}
.kw li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.kw li:last-child{border:0}
.kw li b{font-weight:700}.kw li span{color:var(--fr)}
.vq{padding:12px 14px;border-top:2px solid var(--line)}
.vq p{margin:0 0 8px}
.vq .opts{display:grid;gap:6px}
.vq .opts button{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px 12px;min-height:44px}
.vq .opts button.ok{border-color:var(--grn);background:var(--grnbg)}.vq .opts button.ko{border-color:var(--red);background:var(--redbg)}
.vm .vmg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.vm .col{display:grid;gap:8px;align-content:start}
.vm .vmg button{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px 10px;min-height:52px;text-align:center;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.vm .col.r button{font-weight:700}.vm .col.f button{color:var(--fr)}
.vm .vmg button.sel{border-color:var(--blue);background:var(--blue2);box-shadow:0 0 0 2px var(--blue)}
.vm .vmg button.ok{border-color:var(--grn);background:var(--grnbg);color:var(--grn);opacity:.75}
.vm .vmg button.ko{border-color:var(--red);background:var(--redbg);animation:vmshake .35s}
.vm .vmg button.drag{opacity:.35}
.vm .cnt{color:var(--mut);font-size:14px;margin-left:6px}
.vm .vmd{margin:10px 0 0;font-weight:700}
.vmghost{position:fixed;z-index:50;pointer-events:none;background:var(--card);border:2px solid var(--blue);border-radius:10px;padding:8px 10px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);transform:translate(-50%,-60%) scale(1.05)}
@keyframes vmshake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.nav{display:flex;gap:10px;margin-top:16px}.nav .btn{flex:1}
.note{font-size:14px;color:var(--mut);margin:10px 0}
.res{text-align:center;padding:20px 0}
.res b{font:700 64px/1 var(--fc);display:block}
.res .pass{color:var(--grn)}.res .fail{color:var(--red)}
.search{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-height:46px;margin-bottom:10px}
.lex li{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}
.lex li small{color:var(--mut)}

.card0{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:12px 0 16px}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin:4px 0 2px}.bar i{display:block;height:100%;border-radius:6px;background:#3b82f6}
.brow{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:17px}.brow span:last-child{font-variant-numeric:tabular-nums}
.bars2{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 14px}
.tile{position:relative;overflow:hidden;border:0;border-radius:22px;aspect-ratio:1/1;max-height:240px;width:100%;padding:14px 16px;text-align:left;color:#fff;background:var(--c);box-shadow:0 4px 0 rgba(0,0,0,.12);display:flex;flex-direction:column}
.tile b{font:700 clamp(22px,6vw,30px)/1.05 var(--fc);position:relative;z-index:1}
.tile small{font-size:13px;line-height:1.25;margin-top:3px;opacity:.92;position:relative;z-index:1;max-width:80%}
.tile svg{position:absolute;right:-3%;bottom:-3%;width:56%;height:auto}
.tile:active{transform:scale(.97)}
.ansum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:6px 0 4px}
.ansum div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.ansum b{display:block;font:700 28px/1.1 var(--fc)}.ansum b span{font-size:16px;color:var(--mut)}.ansum small{color:var(--mut);font-size:13px}
.anf{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 14px}
.anf p{margin:0;padding:10px 0 10px 18px;position:relative;border-bottom:1px solid var(--line);line-height:1.45}.anf p:last-child{border-bottom:0}
.anf i{position:absolute;left:0;top:17px;width:9px;height:9px;border-radius:50%}
.anbtn{display:grid;gap:10px;margin:14px 0 6px}.anbtn .btn{width:100%}
.anbars{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:4px 14px}
.anr .brow span:last-child{white-space:nowrap;flex:none}
.anr{padding:10px 0;border-bottom:1px solid var(--line)}.anr:last-child{border-bottom:0}.anr small{color:var(--mut);font-size:13px}.anr .bar{margin:5px 0 3px}
.rows{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 14px;text-align:left;min-height:62px}
.row:last-child{border-bottom:0}.row svg{width:40px;height:40px;flex:none}
.row .tico{width:48px;height:48px;flex:none;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.row b{display:block;font-size:17px}.row span{flex:1}.row small{color:var(--mut);font-size:13px;display:block}
.ru{display:block;font-style:normal;font-size:13px;line-height:1.2;opacity:.85}.brow .ru{font-weight:400;color:var(--mut)}.tile .ru{font-size:15px;font-weight:700;opacity:.9;position:relative;z-index:1}.row .ru{color:var(--fr);font-weight:700}.row::after{content:"›";font-size:26px;color:var(--mut)}
@media(prefers-reduced-motion:no-preference){.tile svg{animation:bob 3.2s ease-in-out infinite}.tile:nth-child(2) svg{animation-delay:-.8s}.tile:nth-child(3) svg{animation-delay:-1.6s}.tile:nth-child(4) svg{animation-delay:-2.4s}
 @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-2deg)}}
 .lamp{animation:blink 2.4s steps(1) infinite}@keyframes blink{50%{opacity:.35}}.tile{transition:transform .1s}}

.fx{position:fixed;left:50%;top:42%;width:150px;height:150px;margin:-75px 0 0 -75px;z-index:50;pointer-events:none;perspective:600px}
.fx>div{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;transform-style:preserve-3d;animation:fxin .9s cubic-bezier(.2,1.6,.4,1) both}
.fx.ok>div{background:radial-gradient(circle at 35% 30%,#6fe08d,#1f8a3b 70%);box-shadow:0 14px 0 #146329,0 24px 40px rgba(0,0,0,.35)}
.fx.ko>div{background:radial-gradient(circle at 35% 30%,#ff7a70,#d7261e 70%);box-shadow:0 14px 0 #8f1712,0 24px 40px rgba(0,0,0,.35);animation:fxin .9s cubic-bezier(.2,1.6,.4,1) both,shake .45s .35s both}
.fx svg{width:62%;height:62%;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.fx path{fill:none;stroke:#fff;stroke-width:14;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:120;stroke-dashoffset:120;animation:draw .35s .2s ease-out forwards}
.fx.ko path+path{animation-delay:.38s}
.fx.out{animation:fxout .3s ease-in forwards}
@keyframes fxin{0%{transform:scale(.2) rotateY(-90deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotateY(0)}}
@keyframes fxout{to{opacity:0;transform:scale(.6) translateY(-30px)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes shake{0%,100%{translate:0}20%{translate:-12px}40%{translate:10px}60%{translate:-7px}80%{translate:4px}}
.cop{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(8,16,36,.78);animation:copin .3s ease both;-webkit-tap-highlight-color:transparent}
.cop.out{animation:copout .35s ease both}@keyframes copin{from{opacity:0}}@keyframes copout{to{opacity:0}}
.cop .box{position:relative;width:min(340px,88vw);text-align:center}

@keyframes copGlow{0%{transform:scale(.3);opacity:0}30%{opacity:1}50%{transform:scale(1.05)}100%{transform:scale(.95);opacity:.85}}
.cop .p1{animation:copPop .7s cubic-bezier(.3,1.5,.5,1) both,copPump .5s .9s ease-in-out 3,copHide 4.4s both}
.cop .p2{animation:copJump 4.4s both}
@keyframes copPop{0%{transform:scale(.2) translateY(60px);opacity:0}100%{transform:none;opacity:1}}
@keyframes copPump{50%{transform:scale(1.06,.95) rotate(-2deg)}}
@keyframes copHide{0%,52%{visibility:visible}53%,79%{visibility:hidden}80%,100%{visibility:visible}}
@keyframes copJump{0%,52%{visibility:hidden;transform:none}53%{visibility:visible;transform:scale(1.08,.9)}62%{transform:translateY(-46px) rotate(-4deg)}70%{transform:translateY(-58px) rotate(3deg)}79%{visibility:visible;transform:translateY(0) scale(1.06,.94)}80%,100%{visibility:hidden}}
.cop .st{position:absolute;z-index:2;left:50%;top:58%;width:40px;height:40px;margin:-20px;filter:drop-shadow(0 0 6px rgba(255,220,80,.9));pointer-events:none;opacity:0;animation:fly 1.1s var(--d) cubic-bezier(.15,.7,.3,1) both}

.cop .go{margin-top:22px;min-width:160px;animation:bub .4s 1.2s both}
/* billet échoué : policier triste sous son nuage, puis il remonte le moral */
.cop.pol{background:rgba(8,10,22,.88);animation:polBg 1.1s steps(1) infinite}
@keyframes polBg{0%{box-shadow:inset 0 0 140px 30px rgba(40,90,255,.55)}50%{box-shadow:inset 0 0 140px 30px rgba(255,40,60,.55)}}
.cop .polf{width:min(68vw,300px);aspect-ratio:2/3;margin:0 auto;border-radius:18px;overflow:hidden;border:4px solid #fff;

@keyframes polIn{from{transform:translateY(60px) rotate(-8deg) scale(.7);opacity:0}}

@keyframes sadIn{from{transform:translateY(50px);opacity:0}}

.cop.sad .p2,.cop.sad .glow,.cop.sad .bub,.cop.sad .acts{display:none}
.cop .cloud{position:absolute;z-index:3;left:50%;top:-30%;width:150px;margin-left:-75px;animation:cloudIn .7s .2s ease-out both}
.cop .cloud .d{animation:drop 1s linear infinite;opacity:0}
.cop .cloud .d:nth-of-type(2){animation-delay:.33s}.cop .cloud .d:nth-of-type(3){animation-delay:.66s}
@keyframes cloudIn{from{transform:translateY(-30px);opacity:0}}

/* ===== Refonte « BD urbaine au crépuscule » =====
   VOICE: calme, encourageant, comme une policière qui guide un élève
   PICTURE: une grande ville russe au crépuscule après la pluie (img/ville.svg) + portraits WebP des personnages
   COLOUR: bleu nuit #10162E, ardoise #202B43, crème #F4EEE6, ambre #FFB366 (action), vert #58D89B (juste), corail #FF7772 (faute)
   TYPE: titres condensés « Titre » (cyrillique), texte en police système très lisible */
body{background:var(--night) linear-gradient(180deg,#141c3a 0,var(--night) 420px) no-repeat}
.top{background:rgba(16,22,46,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid #2B3656}
.plate{border-color:var(--cream);color:var(--cream);font-family:var(--fc);letter-spacing:.02em}
.tbtn{border-color:rgba(244,238,230,.55);color:var(--cream)}
h1,h2{font-family:var(--fc);letter-spacing:.01em}
button:focus-visible,a:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.btn{background:var(--amber);color:var(--night)}.btn.ghost{background:none;color:var(--cream);border:2px solid rgba(244,238,230,.5)}
.bar i{background:var(--amber)}.stat{border-top-color:var(--amber)}
.strip .cur{border-color:var(--amber);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--amber)}
.strip .ok{color:var(--night)}.strip .ko{color:var(--night)}
.ans button{border-color:var(--line)}.ans button:not(:disabled):hover{border-color:#5a6a90}
.ans button.ok .n,.ans button.ko .n,.ans button.sel .n{color:var(--night)}
.say.on,.tip .say.on{background:var(--amber);color:var(--night)}
.kw h3{color:var(--night)}.langmenu button.on{color:var(--amber)}
.frbtn[aria-pressed=true]{color:var(--night)}
.tile{color:var(--cream);background:linear-gradient(165deg,var(--c),#1A2238 115%);box-shadow:0 4px 0 rgba(0,0,0,.35),inset 0 0 0 1px rgba(244,238,230,.08)}
.tile b{font-family:var(--fc)}
.rows,.card0,.anbars,.anf,.ansum div{border-color:#2E3A57}
/* portraits : emplacements WebP transparents, retirés proprement s'ils manquent */
img.port{display:block;flex:none;pointer-events:none;-webkit-user-select:none;user-select:none;object-fit:cover;object-position:50% 8%;border-radius:14px;border:2px solid rgba(244,238,230,.22);box-shadow:0 8px 18px rgba(0,0,0,.35);background:var(--slate)}
/* accueil */
.hero{position:relative;border-radius:22px;overflow:hidden;background:var(--night);margin:2px 0 18px;border:1px solid #2B3656;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.hero .scene{position:relative;height:clamp(230px,62vw,330px);background:url(img/accueil.webp) 84% 2%/auto 150%,url(img/ville.svg) 50% 62%/cover}
.hero .scene::after{content:"";position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,var(--night))}
.hero .txt{position:relative;z-index:2;padding:4px 20px 20px}
.hero h1{font-size:clamp(38px,10vw,58px);line-height:1;margin:0;color:var(--cream);text-shadow:0 2px 0 rgba(0,0,0,.35)}
.hero h1 .ru{font:700 17px/1.3 var(--fb);color:var(--amber);opacity:1;letter-spacing:0;margin-top:4px;text-shadow:none}
.hero p{margin:10px 0 0;font-size:18px;line-height:1.35}.hero p .ru{font-size:14px;color:var(--mut);opacity:1;margin-top:2px}
.hero .go{margin-top:16px;min-height:54px;font-size:18px;padding:0 26px;border-radius:14px;display:inline-flex;flex-direction:column;justify-content:center;align-items:flex-start;line-height:1.15;box-shadow:0 4px 0 #B8743A}
.hero .go .ru{font-size:13px;color:var(--night);opacity:.75}
.hero .go:active{transform:translateY(3px);box-shadow:0 1px 0 #B8743A}
.hero .meta{margin:12px 0 0;font-size:14px;color:var(--mut)}
@media(min-width:720px){
 .hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:0;aspect-ratio:1672/941;background:url(img/accueil.webp) 100% 50%/cover,url(img/ville.svg) 70% 62%/cover}
 .hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--night) 28%,rgba(16,22,46,0) 52%)}
 .hero .scene{order:2;height:auto;background:none}.hero .scene::after{display:none}
 .hero .txt{order:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:30px 10px 30px 32px}}
/* bandeau de personnage (Vera, Mikhaïl) en tête de rubrique */
.guide{display:flex;align-items:flex-end;gap:12px;margin:0 0 6px;min-height:0}
.guide img.port{width:84px;height:104px;margin-bottom:6px}
.guide .gt{flex:1}
/* quiz : correction dans un bloc dédié, la policière reste dedans */
.corr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;align-items:end;border-radius:14px;padding:12px 12px 0 14px;margin:4px 0 0;background:var(--blue2);border:2px solid var(--line);overflow:hidden}
.corr.ok{border-color:var(--green);background:linear-gradient(160deg,#173B33,var(--blue2) 70%)}
.corr.ko{border-color:var(--coral);background:linear-gradient(160deg,#3E2436,var(--blue2) 70%)}
.corr .cbody{align-self:start}
.verdict{display:flex;align-items:flex-start;gap:10px;margin:0 0 10px}
.verdict svg{width:34px;height:34px;flex:none}
.verdict b{display:block;font:700 22px/1.1 var(--fc)}.verdict .ru{font-size:13px;color:var(--mut)}
.corr.ok .verdict b{color:var(--green)}.corr.ko .verdict b{color:var(--coral)}
.corr .tip{background:none;border:0;padding:0;border-radius:0}
.corr{padding-bottom:12px;align-items:start}.corr img.port{width:112px;height:112px;transform-origin:50% 100%}
@media(max-width:480px){.corr img.port{width:76px;height:76px;border-radius:12px}}
.qorig{margin:14px 0 0;background:none;border:1px solid var(--line);font-size:14px}
.q{font-size:20px;line-height:1.38;margin:0 0 4px}
.pic{margin:12px 0 4px}
@media(max-width:600px){main{padding-left:12px;padding-right:12px}.ans button{padding:10px 10px;gap:8px;grid-template-columns:28px minmax(0,1fr)}}
/* bilan */
.res .rhead{display:flex;align-items:flex-end;justify-content:center;gap:12px}
.res .rhead img.port{width:92px;height:116px}
.res .score{font:700 72px/1 var(--fc)}
.rev{text-align:left;background:var(--card);border:1px solid #2E3A57;border-radius:16px;padding:10px 14px;margin:16px 0 0}
.rev h3{margin:0 0 6px;font:700 19px var(--fc)}.rev li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}.rev li:last-child{border:0}
.rev ul{list-style:none;margin:0;padding:0}.rev li small{color:var(--coral);font-weight:700;white-space:nowrap}
/* transitions courtes, coupées si l'utilisateur réduit les animations */
@media(prefers-reduced-motion:no-preference){
 .hero .txt>*{animation:rise2 .45s ease-out both}.hero .txt>*:nth-child(2){animation-delay:.06s}.hero .txt>*:nth-child(3){animation-delay:.12s}
 @keyframes rise2{from{opacity:0;transform:translateY(10px)}}@keyframes fadeup{from{opacity:0;transform:translateY(16px)}}
 .corr{animation:rise2 .25s ease-out both}
 .corr.ok img.port{animation:nod .9s .15s ease-in-out both}@keyframes nod{30%{transform:rotate(-1.5deg) translateY(2px)}60%{transform:rotate(1deg)}}
 .corr.ko img.port{animation:fadeup .35s ease-out both}}
@media(prefers-reduced-motion:reduce){#app.swl,#app.swr{animation:none}}

/* ===== Style « affiche » (maquette validée) =====
   fond violet nuit, panneaux à coins coupés bordés de violet, titres en capitales grasses inclinées, boutons orange » */
:root{--night:#140E20;--slate:#221833;--bg:var(--night);--card:var(--slate);--blue2:#2C2142;--line:#4A3864;--mut:#B9AECB;
 --orange1:#FFB547;--orange2:#F58A1F;--teal:#2FE0B0;--bd:#5B4478;--pbg:linear-gradient(#1E152E,#1E152E);
 --fa:"Affiche","Titre",Impact,sans-serif}

<body>
<header class="top">
  <div class="logo" aria-hidden="true"><b>ПДД</b><b>MOSCOW</b><small>2026 by Azmo</small></div>
  <button class="plate" id="home">ПДД 2026</button>
  <span class="sp"></span>
  <button class="tbtn" id="langbtn" aria-label="Langue / Language"></button>
  <button class="tbtn" id="lexbtn">Lexique</button>
</header>
<main id="app"><p class="note">Chargement des 800 questions…</p></main>
<script>
{
const $=s=>document.querySelector(s), app=$('#app');

function useEnglish(E){
  Q.forEach((q,i)=>{const x=E.q&&E.q[i];if(x){q.fq=x[0];q.fa=x[1];if(x[2])q.fh=x[2]}});
  G.forEach((g,i)=>{const x=E.g&&E.g[i];if(x)g[1]=x});
  document.documentElement.lang=LANG;if(LANG==='ar')document.body.classList.add('rtl');
  const ex=E.ex,sub=E.sub,rx=E.rx.map(([a,b])=>[new RegExp(a),b]);
  const tr=(t,at)=>{const core=t.trim();if(!core||!/[A-Za-zÀ-ÿ]/.test(core))return t;
    const nums=core.match(/\d+/g)||[],key=(at?'@':'')+core.replace(/\d+/g,'#');let r=ex[key];
    if(r!==undefined){let i=0;r=r.replace(/^@/,'').replace(/#/g,()=>nums[i]!==undefined?nums[i++]:'#')}
    else{r=core;for(const[a,b]of rx)if(a.test(r)){r=r.replace(a,b);break}
      for(const[a,b]of sub)if(r.includes(a))r=r.split(a).join(b)}
    return r===core?t:t.replace(core,r)};
  const ATT=['aria-label','alt','placeholder','title'];
  const walk=n=>{if(n.nodeType===3){const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;return}
    if(n.nodeType!==1||n.closest('script,style'))return;
    const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);let t;const ts=[];while(t=w.nextNode())ts.push(t);
    ts.forEach(t=>{if(!t.parentElement.closest('script,style')){const v=tr(t.nodeValue);if(v!==t.nodeValue)t.nodeValue=v}});
    [n,...n.querySelectorAll('[aria-label],[alt],[placeholder],[title]')].forEach(e=>ATT.forEach(a=>{const v=e.getAttribute(a);if(v){const r=tr(v,1);if(r!==v)e.setAttribute(a,r)}}))};
  new MutationObserver(ms=>ms.forEach(m=>m.type==='childList'?m.addedNodes.forEach(walk):walk(m.target)))
    .observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:ATT});
  walk(document.body)}

async function trTip(k){
  const q=Q[k];S.tipBusy=true;S.tipErr='';renderQuiz();
  try{
    const r=await sample(`Traduis en français cette explication du code de la route russe (ПДД РФ). Traduction fidèle et complète, vocabulaire du code de la route français (обгон = dépassement, опережение = devancement, уступить дорогу = céder le passage, проезжая часть = chaussée). Garde les numéros de panneaux, de marquage et de points tels quels. Réponds uniquement par la traduction.\n\n${q.h}`,{modelTier:'default'});
    const t=(r.text||'').trim();if(!t)throw{code:'empty'};
    HF[k]=t;try{await db.doc('fh/q'+k).set({t})}catch(e){}
  }catch(e){S.tipErr=e.code==='not_granted'?'Traduction refusée dans cette vue.':e.code==='rate_limited'?'Limite atteinte, réessaie plus tard.':'La traduction a échoué.'}
  S.tipBusy=false;renderQuiz();
}

function targeted(P,n){const weak=p=>P.th[p].n>=4?1-P.th[p].r:.35,txtW=P.txt.n>=15&&P.txt.r<P.img.r-.08,lngW=P.lng.n>=15&&P.lng.r<P.sht.r-.08;

function vmPair(v,a,b){/* a,b = {s,g} de colonnes opposées */

  const x=c.getContext('2d'),dpr=Math.min(2,devicePixelRatio||1);let W,H;
  const size=()=>{W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)};size();
  const cols=['#ffd54a','#ff5a4f','#4fc3ff','#7cf08e','#c58bff','#ffffff','#ff9f43'],P=[];
  const burst=()=>{const cx=W*(.15+Math.random()*.7),cy=H*(.12+Math.random()*.35),col=cols[Math.random()*cols.length|0],n=60;
    for(let i=0;i<n;i++){const a=Math.PI*2*i/n,s=2+Math.random()*4;P.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:Math.random()<.25?'#fff':col,r:2+Math.random()*2})}};
  let k=0;const iv=setInterval(()=>{burst();if(++k>=7)clearInterval(iv)},380);burst();
  const t0=performance.now();
  (function loop(now){x.clearRect(0,0,W,H);
    for(let i=P.length-1;i>=0;i--){const p=P[i];p.vx*=.985;p.vy=p.vy*.985+.06;p.x+=p.vx;p.y+=p.vy;p.l-=.012;
      if(p.l<=0){P.splice(i,1);continue}
      x.globalAlpha=p.l;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}
    if(now-t0<4200||P.length)requestAnimationFrame(loop);else c.remove()})(t0)}

/* ---------- sons (synthétisés, marchent hors ligne) ---------- */
const SND=(()=>{let ac=null,out=null;const on=()=>localStorage.getItem('pdd-snd')!=='0';
  /* timbre marimba grave : fondamentale + sous-octave pour les basses, harmonique 4 très courte pour le « toc » ; aigus coupés */
  function ctx(){if(!on())return null;if(!ac){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;ac=new A();
      const sr=ac.sampleRate,g=ac.createGain();g.gain.value=.8;const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1400;lp.Q.value=.4;
      const cv=ac.createConvolver(),L=Math.floor(sr*1.4),ir=ac.createBuffer(2,L,sr);
      for(let c=0;c<2;c++){const d=ir.getChannelData(c);let s=0;for(let i=0;i<L;i++){s=s*.75+(Math.random()*2-1)*.25;d[i]=s*Math.pow(1-i/L,4)}}
      cv.buffer=ir;const wet=ac.createGain();wet.gain.value=.18;
      g.connect(lp);lp.connect(ac.destination);lp.connect(cv);cv.connect(wet);wet.connect(ac.destination);out=g}
    if(ac.state==='suspended')ac.resume();return ac}
  function mk(f,type,v,s,d){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+.006);g.gain.exponentialRampToValueAtTime(.0005,s+d);o.connect(g);g.connect(out);o.start(s);o.stop(s+d+.05)}
  function n(m,t=0,v=.4,d=.55){const f=440*Math.pow(2,(m-69)/12),s=ac.currentTime+.02+t;
    mk(f,'sine',v,s,d);mk(f/2,'sine',v*.55,s,d*1.2);mk(f*4,'sine',v*.1,s,.07);mk(f*2,'triangle',v*.12,s,d*.4)}
  const P={
    ok(){n(64,0,.38,.35);n(69,.1,.45,.7)},                     /* mi → la : « ding-ding » grave */
    ko(){n(57,0,.3,.4);n(53,.16,.32,.6)},                      /* la → fa : « bwoum » */
    combo(){[60,64,67,72].forEach((m,i)=>n(m,i*.07,.3,.5))},
    tap(){n(60,0,.1,.12)},
    win(){[48,52,55,60,64,67].forEach((m,i)=>n(m,i*.08,.24,.5));[48,60,64,67].forEach(m=>n(m,.55,.16,1.6))},
    streak(){[55,60,64,67,72].forEach((m,i)=>n(m,i*.09,.3,.6));n(60,.5,.3,1.4)},
    /* « na-ning, na-ning ! » : petite voix qui glisse vers le haut, puis fanfare de gagnant */
    cop(){const v=(a,b,t,d)=>{const s=ac.currentTime+.02+t,f0=440*Math.pow(2,(a-69)/12),f1=440*Math.pow(2,(b-69)/12);
        [['triangle',.32,1],['sine',.22,2],['sine',.2,.5]].forEach(([ty,vol,mul])=>{const o=ac.createOscillator(),g=ac.createGain(),vb=ac.createOscillator(),vg=ac.createGain();
          o.type=ty;o.frequency.setValueAtTime(f0*mul,s);o.frequency.exponentialRampToValueAtTime(f1*mul,s+d*.45);
          vb.frequency.value=7;vg.gain.value=f1*mul*.012;vb.connect(vg);vg.connect(o.frequency);
          g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(vol,s+.02);g.gain.setValueAtTime(vol,s+d*.6);g.gain.exponentialRampToValueAtTime(.0005,s+d);
          o.connect(g);g.connect(out);o.start(s);vb.start(s);o.stop(s+d+.05);vb.stop(s+d+.05)})};
      v(60,67,0,.2);v(64,72,.2,.34);v(62,69,.62,.2);v(65,74,.82,.42);
      [60,64,67,72].forEach((m,i)=>n(m,1.35+i*.09,.3,.5));[48,60,64,67,72].forEach(m=>n(m,1.75,.2,1.8))},
    /* triste : trois notes graves qui descendent ; puis espoir : petite montée douce */
    sad(){n(55,0,.24,.55);n(53,.38,.24,.55);n(50,.76,.26,1.1)},
    hope(){[48,52,55,60].forEach((m,i)=>n(m,i*.1,.24,.5));n(64,.45,.22,1.1)},
    badge(){n(60,0,.32,.5);n(67,.12,.32,.6);n(72,.24,.36,1)}};
  return{play(x){try{if(ctx())P[x]()}catch(e){}},on,set(v){localStorage.setItem('pdd-snd',v?'1':'0');if(v)this.play('ok')},unlock:()=>{try{ctx()}catch(e){}}}})();

/* au lancement : la série est-elle encore vivante ? (joker utilisé si un seul jour manqué) */
function checkStreak(){const d=D(),t=dkey();d.froze=0;if(!d.last||!d.streak)return;const gap=dayDiff(d.last,t);if(gap<=1)return;
  const miss=gap-1;if(miss<=d.freeze){d.freeze-=miss;for(let i=1;i<=miss;i++)d.days[shiftDay(d.last,i)]={frz:1};d.last=shiftDay(t,-1);d.froze=miss}
  else{d.lost=d.streak;d.streak=0}save()}

/* petit policier de l'accueil : coucou au lancement, puis content (défi fait) ou fâché (défi pas fait) */
let copHi=true;
const COPS={hi:['alina-main','Coucou ! Content de te revoir.','Привет!'],ok:['alina-pouce','Défi du jour fait, bravo ! Reviens demain.','Молодец!'],ko:[['alina-baton','alina-menottes'],{fr:'Tu dois faire ton quiz du jour ! Tu ne l\'as pas fait, tu vas te faire arrêter.',en:'You must do your daily quiz! You haven\'t done it, you\'re going to get arrested.',zh:'你必须完成今日测验！你还没做，你要被逮捕了。',ar:'يجب أن تكمل اختبار اليوم! لم تفعله بعد، سيتم اعتقالك.'},'Ты не прошёл задание дня — сейчас арестую!']};
const copInner=m=>{const c=COPS[m],t=typeof c[1]==='object'?c[1][LANG]||c[1].fr:c[1],img=Array.isArray(c[0])?c[0][Math.random()*c[0].length|0]:c[0];return`<img class="${/^(policiere|agent|alina-(main|baton|menottes|pouce))/.test(img)?'ph':''}" src="cop/${img}.webp" alt="${/^(policiere|agent|alina-(main|baton|menottes|pouce))/.test(img)?'Policière':'Policier'}"><p class="cb">${t}<em>${c[2]}</em></p>`};
function copRow(done){const m=copHi?'hi':done?'ok':'ko';
  if(copHi){copHi=false;setTimeout(()=>{const r=document.querySelector('.dqcop');if(r){const m2=r.dataset.m;r.className='dqcop '+m2;r.innerHTML=copInner(m2);bindCop()}},2400)}
  setTimeout(bindCop,0);
  return`<div class="dqcop ${m}" data-m="${done?'ok':'ko'}">${copInner(m)}</div>`}
function bindCop(){const r=document.querySelector('.dqcop'),i=r&&r.querySelector('img');if(!i)return;
  i.onclick=()=>{if(r.dataset.m==='ko'){startDaily();return}r.classList.remove('jump','ok');void r.offsetWidth;r.classList.add('jump');SND.play('combo');setTimeout(()=>{r.classList.remove('jump');r.classList.add('ok')},900)}}
function dailyCard(){const d=D(),t=dkey(),today=d.days[t]||{},done=!!today.done,lv=level(d.xp),nx=LVX[lv+1];
  const h=24-new Date().getHours();
  const msg=done?`Défi fait aujourd'hui (+${today.xp} XP). Reviens demain pour garder ta série.`
    :d.streak?`Ta série de ${d.streak} jour${d.streak>1?'s':''} s'arrête à minuit (encore ${h} h) si tu ne fais pas le défi.${d.freeze?` Jokers : ${d.freeze}.`:''}`
    :d.lost?`Ta série de ${d.lost} jours s'est arrêtée. Recommence aujourd'hui.`:`10 questions par jour. Chaque jour fait allonge ta série.`;
  const wd=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
  const week=Array.from({length:7},(_,i)=>{const k=shiftDay(t,i-6),x=d.days[k],dt=new Date(k+'T12:00');return`<span class="${x&&x.done?'on':x&&x.frz?'frz':''} ${k===t?'now':''}"><i>${x&&x.done?'✓':x&&x.frz?'❄':dt.getDate()}</i>${wd[dt.getDay()]}</span>`}).join('');
  return`<div class="stk"><div class="stkt"><span class="flame ${d.streak?'':'off'}">${FLAME}<b>${d.streak}</b></span><span><span class="aff">jour${d.streak>1?'s':''} de suite</span><em class="ru">дней подряд</em></span><i class="sep"></i><span class="xpc"><b>${d.xp}</b> XP</span></div>
   <div class="week">${week}</div></div>
   <div class="lvlc"><div class="brow"><span>Niveau ${lv+1} · ${LV[lv][0]}<em class="ru">${LV[lv][1]}</em></span><span>${nx?`${d.xp-LVX[lv]}/${nx-LVX[lv]}`:'max'}</span></div><div class="bar"><i style="width:${nx?Math.round((d.xp-LVX[lv])/(nx-LVX[lv])*100):100}%"></i></div></div>
   <div class="dq2 ${done?'done':'todo'}">${d.froze?`<p class="dqn">Un joker a protégé ta série.</p>`:''}
   <div class="dqh"><span class="ico">${done?'<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="28" fill="none" stroke="#2FE0B0" stroke-width="5"/><path d="M19 33l9 9 17-19" fill="none" stroke="#2FE0B0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>':FLAME}</span><i class="bar2" style="color:${done?'#2FE0B0':'#F58A1F'}"></i><div><span class="aff">${done?'Défi du jour terminé':'Défi du jour'}</span>
   <div class="sub2">${done?`<span class="xpb">+${today.xp} XP</span><span class="mol">Молодец !</span>`:'<span>10 questions · Задание дня</span>'}</div></div></div>
   <button class="btn" id="dqgo"><span>${done?'Encore un tour':'Commencer le défi'}</span><span class="chev" aria-hidden="true">»</span></button>
   <p class="dqm">${msg}</p></div>
   <button class="rewd" data-go="recomp"><svg viewBox="0 0 36 40" aria-hidden="true"><path d="M8 22 3 38l7-3 4 5 4-14zM28 22l5 16-7-3-4 5-4-14z" fill="#F58A1F"/><circle cx="18" cy="15" r="13" fill="#FFC83A" stroke="#B86A00" stroke-width="2"/><path d="m18 7 2.4 5 5.4.6-4 3.7 1.1 5.3-4.9-2.7-4.9 2.7 1.1-5.3-4-3.7 5.4-.6z" fill="#B86A00"/></svg><i></i><span>Récompenses · ${BADGES.filter(b=>d.badges[b[0]]).length}/${BADGES.length} badges</span></button>`}

function pickDaily(){const ks=o=>shuffle(Q.map((_,k)=>k).filter(o));
  const err=ks(k=>st.r[k]===0),un=ks(k=>st.r[k]===undefined),ok=ks(k=>st.r[k]===1),out=err.slice(0,4);
  for(const k of [...un.slice(0,8-out.length),...ok,...un,...err])if(out.length<10&&!out.includes(k))out.push(k);return shuffle(out)}
function startDaily(){SND.unlock();S={view:'daily',list:pickDaily(),i:0,pick:null,xp:0,combo:0,maxc:0,wrong:{},again:{},fr:false,tipfr:false};renderDaily();scrollTo(0,0)}
const CHEER=[['Отлично !','Excellent !'],['Верно !','Exact !'],['Молодец !','Bravo !'],['Так держать !','Continue comme ça !'],['Супер !','Super !']];
function renderDaily(){const k=S.list[S.i],q=Q[k],p=S.pick,good=p!==null&&p===q.c,fr=S.fr,n=S.list.length;
  const prog=Math.round((S.i+(p!==null?1:0))/n*100),cheer=CHEER[(S.i*7+k)%CHEER.length];
  /* mots surlignés et cliquables (traduction) : dès que le français est affiché ou après la réponse, comme dans les billets */
  const hlq=t=>(fr||p!==null)&&q.m?hlText(t,q.m):esc(t);
  app.innerHTML=`<div class="dtop"><button class="dx" id="dqx" aria-label="Quitter">✕</button><div class="bar dbar"><i style="width:${prog}%"></i></div><span class="dcombo ${S.combo>=3?'hot':''}">${FLAME}${S.combo}</span></div>
  <div style="display:flex;align-items:center;gap:8px"><p class="dmeta" style="flex:1">${S.again[S.i]?'Question ratée, deuxième chance':'Défi du jour'} · ${S.i+1}/${n} · <b>${S.xp} XP</b></p>${favBtn(k)}</div>${qOrig(q)}
  ${q.i?`<div class="pic">${IMG[q.t]?`<img src="${IMG[q.t][q.i]}" alt="Situation de la question">`:''}</div>`:''}
  <p class="q">${hlq(q.q)}${TTS?`<button class="say" id="dsay" aria-label="Lire la question"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>`:''}</p>
  ${fr?`<p class="fr qfr">${esc(q.fq)}</p>`:''}
  <button class="frbtn" id="frb" aria-pressed="${fr}">${fr?'Masquer le français':'Voir en français'}</button>
  <div class="ans">${q.a.map((x,j)=>`<button data-j="${j}" class="${p===null?'':j===q.c?'ok':j===p?'ko':''}" ${p!==null?'disabled':''}>${numMk(j+1,p===null?'':j===q.c?'ok':j===p?'ko':'')}<span>${hlq(x)}${fr?`<span class="fr">${esc(q.fa[j])}</span>`:''}</span></button>`).join('')}</div>
  ${p!==null?`<div class="sheet ${good?'g':'b'}"><b class="sh">${good?`${cheer[0]} <span>+${S.last} XP</span>`:'Pas tout à fait'}</b><small>${good?cheer[1]:`Bonne réponse : ${q.c+1}. ${S.again[S.i]?'':'Tu reverras cette question à la fin.'}`}</small>
    ${!good?`<p class="shh">${S.tipfr&&q.fh?esc(q.fh):hlq(q.h)}</p>${q.fh?`<button class="tbtn shfr" id="shfr">${S.tipfr?'Русский':'Explication en français'}</button>`:''}`:''}
    <button class="btn shbtn" id="dqnext">${S.i===n-1?'Terminer':'Continuer'}</button></div>`:''}`;
  if(q.i&&!IMG[q.t])loadImg(q.t).then(()=>{if(S.view==='daily'&&S.list[S.i]===k)renderDaily()});
  $('#dqx').onclick=()=>{if(TTS)speechSynthesis.cancel();render.home()};
  $('#frb').onclick=()=>{S.fr=!S.fr;renderDaily()};
  app.querySelectorAll('mark.kwm,.kph').forEach(m=>m.onclick=ev=>{ev.stopPropagation();ev.preventDefault();tipWord(m)});
  const sb=$('#dsay');if(sb)sb.onclick=()=>say(q.q,sb);
  const sf=$('#shfr');if(sf)sf.onclick=()=>{S.tipfr=!S.tipfr;renderDaily()};
  app.querySelectorAll('.ans button').forEach(b=>b.onclick=()=>answerDaily(+b.dataset.j));bindFav(k);
  const nb=$('#dqnext');if(nb){nb.onclick=()=>{if(TTS)speechSynthesis.cancel();SND.play('tap');if(S.i<n-1){S.i++;S.pick=null;S.fr=false;S.tipfr=false;renderDaily();scrollTo(0,0)}else finishDaily()};nb.scrollIntoView({block:'nearest',behavior:'smooth'})}}
function answerDaily(j){if(S.pick!==null)return;const k=S.list[S.i],good=j===Q[k].c;S.pick=j;st.r[k]=good?1:0;logAns(k,good);
  if(good){S.combo++;S.maxc=Math.max(S.maxc,S.combo);S.last=(S.again[S.i]?5:10)+(S.combo>=3?5:0);S.xp+=S.last}
  else{S.combo=0;S.wrong[k]=1;if(!S.again[S.i]){S.list.push(k);S.again[S.list.length-1]=1}}
  save();fx(good);markPop(good);if(good&&[3,5,10,15].includes(S.combo))setTimeout(()=>SND.play('combo'),380);
  renderDaily();if(good)floatXp('+'+S.last+' XP')}
function floatXp(t){const e=document.createElement('div');e.className='fxp';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1300)}
function finishDaily(){const d=D(),t=dkey(),first=!(d.days[t]&&d.days[t].done),perfect=!Object.keys(S.wrong).length,hr=new Date().getHours();
  const lv0=level(d.xp),bonus=[['Défi terminé',20]];if(perfect)bonus.push(['Sans faute',30]);
  let grew=false,gotFreeze=false;
  if(first){d.streak=d.last===shiftDay(t,-1)?d.streak+1:d.last===t?d.streak:1;d.last=t;d.best=Math.max(d.best,d.streak);d.lost=0;grew=true;
    if(d.streak>1)bonus.push(['Série de '+d.streak+' jours',Math.min(d.streak,30)*2]);
    if(d.streak%7===0&&d.freeze<2){d.freeze++;gotFreeze=true}
    if(hr<9)d.am=1;if(hr>=22)d.pm=1}
  const tot=S.xp+bonus.reduce((a,b)=>a+b[1],0);
  d.xp+=tot;d.total+=S.list.length;if(perfect)d.perfect++;d.maxc=Math.max(d.maxc||0,S.maxc);
  const day=d.days[t]&&d.days[t].done?d.days[t]:{done:1,xp:0,n:0,r:0};day.xp+=tot;day.n+=S.list.length;day.r++;d.days[t]=day;
  const nb=BADGES.filter(b=>!d.badges[b[0]]&&b[4](d));nb.forEach(b=>d.badges[b[0]]=t);
  const lv1=level(d.xp);save();
  app.innerHTML=`<div class="res dres"><p class="sub">Défi du jour terminé · Задание выполнено</p>
   <b class="pass" id="xpc">+0</b><p style="font-size:20px;font-weight:700;margin:4px 0">XP gagnés</p>
   <div class="kw" style="text-align:left"><ul><li><b>Bonnes réponses</b><span>+${S.xp}</span></li>${bonus.map(b=>`<li><b>${esc(b[0])}</b><span>+${b[1]}</span></li>`).join('')}</ul></div>
   ${grew?`<div class="bigflame">${FLAME}<b>${d.streak}</b><span>jour${d.streak>1?'s':''} de suite</span></div>`:''}
   ${gotFreeze?`<p class="note" style="font-weight:700;color:var(--fr)">Récompense : un joker. Il protège ta série si tu rates un jour (2 maximum).</p>`:''}
   ${lv1>lv0?`<p class="lvup">Niveau ${lv1+1} : ${LV[lv1][0]}<em class="ru">${LV[lv1][1]}</em></p>`:''}
   ${nb.length?`<h2>Nouveau${nb.length>1?'x':''} badge${nb.length>1?'s':''}</h2><div class="bgrid">${nb.map(b=>`<div class="bdg new">${medal(b,1)}<small>${esc(b[2])}</small></div>`).join('')}</div>`:''}</div>
   <div class="nav"><button class="btn" id="back">Accueil</button>${Object.keys(S.wrong).length?'<button class="btn ghost" id="rev">Revoir mes fautes</button>':''}</div>`;
  const bad=Object.keys(S.wrong).map(Number);
  $('#back').onclick=render.home;const r=$('#rev');if(r)r.onclick=()=>startList(bad,'Fautes du défi','free');
  const el=$('#xpc'),t0=performance.now();(function up(now){const f=Math.min(1,(now-t0)/1100);el.textContent='+'+Math.round(tot*(1-Math.pow(1-f,3)));if(f<1)requestAnimationFrame(up)})(t0);
  setTimeout(celebrate,200);if(grew)setTimeout(()=>SND.play('streak'),1500);if(nb.length||lv1>lv0)setTimeout(()=>SND.play('badge'),2600);
  /* après le « Bravo ! » : la policière récompense le sans-faute, ou promet la surprise s'il y a eu des fautes */
  const nq=new Set(S.list).size,nw=Object.keys(S.wrong).length;
  setTimeout(()=>{if(S.view==='quiz'||!document.querySelector('.dres'))return;perfect?copWin():copTease((nq-nw)+'/'+nq)},3900)}

render.recomp=function(){S={view:'recomp'};const d=D(),lv=level(d.xp);
  app.innerHTML=`<h1>Récompenses</h1><p class="sub">Награды. Série actuelle : ${d.streak} · record : ${d.best} · jokers : ${d.freeze}/2 · ${d.xp} XP</p>
  <h2>Badges</h2><div class="bgrid">${BADGES.map(b=>`<div class="bdg ${d.badges[b[0]]?'':'lock'}">${medal(b,d.badges[b[0]])}<small>${esc(b[2])}</small></div>`).join('')}</div>
  <h2>Niveaux</h2><div class="kw"><ul>${LV.map((x,i)=>`<li style="${i===lv?'font-weight:700;background:var(--yel)':i>lv?'opacity:.5':''}"><b>${i+1}. ${x[0]}</b><span>${x[1]} · ${LVX[i]} XP</span></li>`).join('')}</ul></div>
  <h2>Comment gagner des XP</h2><div class="kw"><ul><li><b>Bonne réponse</b><span>+10 (+5 au 2e essai)</span></li><li><b>Combo de 3 et plus</b><span>+5 par réponse</span></li><li><b>Défi terminé</b><span>+20</span></li><li><b>Sans faute</b><span>+30</span></li><li><b>Série de jours</b><span>+2 par jour (max +60)</span></li><li><b>7 jours de suite</b><span>un joker</span></li></ul></div>
  <h2>Sons</h2><button class="btn ${SND.on()?'':'ghost'}" id="snd">${SND.on()?'Sons activés':'Sons coupés'}</button><p class="note">Sur iPhone, l'interrupteur silencieux coupe aussi les sons de l'appli.</p>`;
  $('#snd').onclick=()=>{SND.set(!SND.on());render.recomp()}};

$('#home').onclick=()=>{clearInterval(tick);if(TTS)speechSynthesis.cancel();render.home()};
$('#lexbtn').onclick=()=>{clearInterval(tick);render.lexique()};

/* ---------- démarrage ---------- */
Promise.all([fetch('q.json').then(r=>r.json()),fetch('g.json').then(r=>r.json()),LFILE[LANG]?fetch(LFILE[LANG]).then(r=>r.json()).catch(()=>null):null]).then(([d,g,e])=>{Q=d;G=g;if(e)useEnglish(e);checkStreak();render.home()}).catch(()=>{app.innerHTML='<p class="note">Impossible de charger les questions.</p>'});
if(window.claude&&claude.use){
  claude.use('sample').then(s=>{sample=s;if(S&&S.view==='quiz')renderQuiz()}).catch(()=>{});
  Promise.all([claude.use('db'),claude.use('user')]).then(async([d,u])=>{
    if(!d)return;db=d;
    try{uid=u&&await u.id()}catch(e){}
    if(uid){try{const s=await db.doc('data/users/'+uid+'/state').get();if(s.exists){const v=s.data();if(v&&v.r&&Object.keys(v.r).length>=Object.keys(st.r).length){st=norm(v);checkStreak();if(S&&S.view==='home')render.home()}}}catch(e){}}
  }).catch(()=>{});
}
}
</script>
<script>
{const N=48;
async function offStat(){const el=document.getElementById('offst');if(!el)return;
  if(!('serviceWorker' in navigator)||!window.caches){el.textContent='Hors ligne : non pris en charge par ce navigateur.';return}
  try{const c=await caches.open('pdd-offline'),n=(await c.keys()).length;
    if(n>=N){el.textContent='Hors ligne : prêt. Tu peux passer en mode avion.';el.style.color='var(--grn)'}
    else{el.textContent='Hors ligne : téléchargement '+n+'/'+N+'… garde l\'application ouverte avec Internet.';el.style.color='#e07b00';setTimeout(offStat,1500)}}catch(e){el.textContent=''}}
window.offStat=offStat;
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
/* nouvelle version en ligne : recharger tout de suite à l'accueil, sinon proposer un bandeau */
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',e=>{if(e.data!=='pdd-update')return;
  const v=window.pddView&&pddView();if(!v||v==='home')return location.reload();
  if(document.querySelector('.updbar'))return;const b=document.createElement('button');b.className='updbar';b.textContent='Nouvelle version disponible — toucher pour mettre à jour';b.onclick=()=>location.reload();document.body.appendChild(b)});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(()=>setTimeout(offStat,800)).catch(()=>{});
}
</script>
