<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ПДД 2026 · RU/FR</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon180.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ПДД by Azmo">
<meta name="theme-color" content="#1b4f9c">
<style>
/* VOICE: sobre, pratique, comme un terminal d'examen du ГИБДД
   IDEA: la plaque de panneau routier russe — bleu de signalisation, bord blanc, chiffres nets
   PICTURE: la carte-question elle-même (image, question, réponses) en haut de l'écran
   COLOUR and TYPE: blanc, bleu panneau #1b4f9c, rouge #d7261e pour les fautes, vert pour les bonnes; PT Sans (cyrillique) + PT Sans Narrow
   LAYOUT: barre bleue, une colonne de 780px, grille de 40 billets, réponses empilées */
:root{color-scheme:light dark;--bg:light-dark(#fff,#0f1622);--ink:light-dark(#141a22,#e8edf4);--mut:light-dark(#5b6675,#9aa6b6);--blue:#1b4f9c;--blue2:light-dark(#e8eef8,#17263d);--line:light-dark(#d9dfe7,#2a3647);--red:#d7261e;--redbg:light-dark(#fde9e8,#3a1715);--grn:#1f8a3b;--grnbg:light-dark(#e5f4e8,#13301c);--card:light-dark(#fff,#151e2c);--fr:light-dark(#1b4f9c,#8fb4ec);--yel:light-dark(#fff6d6,#2e2814)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "PT Sans",system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #f2b705;outline-offset:2px}
.top{background:var(--blue);color:#fff;padding:10px max(4vw,14px);display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:5}
.plate{border:2px solid #fff;border-radius:6px;padding:2px 8px;font:700 20px/1.2 "PT Sans Narrow",sans-serif;background:none;color:#fff}
.top .sp{flex:1}
.tbtn{background:none;border:1.5px solid #fff;color:#fff;border-radius:8px;min-height:38px;padding:0 12px;font-size:14px}
main{max-width:780px;margin:0 auto;padding:18px max(4vw,14px) 60px}
h1{font:700 clamp(30px,6vw,44px)/1.05 "PT Sans Narrow",sans-serif;margin:8px 0 4px;text-wrap:balance}
h2{font:700 22px/1.2 "PT Sans Narrow",sans-serif;margin:24px 0 10px}
.sub{color:var(--mut);margin:0 0 16px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
.stat{border-top:3px solid var(--blue);padding:8px 2px}
.stat b{display:block;font:700 28px/1 "PT Sans Narrow",sans-serif}
.stat b small{font-size:16px}
.stat span{color:var(--mut);font-size:13px}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mode{background:var(--blue2);border:0;border-radius:12px;padding:14px;text-align:left;min-height:76px}
.mode b{display:block;font-size:17px}.mode span{color:var(--mut);font-size:14px}
.mode.main{background:var(--blue);color:#fff}.mode.main span{color:#d6e2f5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.tk{aspect-ratio:1;border:2px solid var(--line);background:var(--card);border-radius:10px;font:700 20px "PT Sans Narrow",sans-serif;position:relative}
.tk small{position:absolute;bottom:4px;left:0;right:0;font:400 11px "PT Sans",sans-serif;color:var(--mut)}
.tk.ok{border-color:var(--grn);background:var(--grnbg)}.tk.ko{border-color:var(--red);background:var(--redbg)}.tk.go{border-color:#e07b00;background:light-dark(#fff1de,#3a2810)}
.tk i{position:absolute;top:3px;right:5px;font:700 11px "PT Sans",sans-serif;font-style:normal;color:var(--mut)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--mut);margin:0 0 14px}.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.pend{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}.pend button{border:2px solid #e07b00;background:light-dark(#fff1de,#3a2810);border-radius:10px;min-height:44px;padding:0 14px;font-weight:700}
.list button{display:flex;width:100%;justify-content:space-between;gap:10px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px;min-height:52px}
.list small{color:var(--mut);white-space:nowrap}
.btn{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:0 18px;min-height:46px;font-weight:700}
.btn.ghost{background:none;color:var(--fr);border:2px solid var(--fr)}
.btn:disabled{opacity:.45;cursor:default}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.qhead .t{font:700 18px "PT Sans Narrow",sans-serif;flex:1}
.timer{font:700 18px "PT Sans Narrow",sans-serif;font-variant-numeric:tabular-nums;color:var(--fr)}
.strip{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.strip button{flex:none;width:34px;height:34px;border-radius:6px;border:1.5px solid var(--line);background:var(--card);font-size:13px;padding:0}
.strip .cur{border-color:var(--blue);border-width:3px;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--blue);font-weight:700}.strip{padding:5px 4px 8px;scroll-padding:0 40%}
.strip .ok{background:var(--grn);color:#fff;border-color:var(--grn)}.strip .ko{background:var(--red);color:#fff;border-color:var(--red)}
.pic{border-radius:10px;overflow:hidden;background:#000;margin-bottom:14px;aspect-ratio:604/225}
.pic img{display:block;width:100%;height:auto}
.q{font-size:19px;font-weight:700;line-height:1.35;margin:0}
.fr{color:var(--fr);font-style:italic}
.qfr{font-size:17px;margin:6px 0 0}
.frbtn{display:inline-flex;align-items:center;gap:8px;margin-top:10px;background:var(--blue2);border:0;border-radius:999px;padding:0 16px;min-height:40px;font-size:15px;font-weight:700;color:var(--fr)}
.frbtn[aria-pressed=true]{background:var(--fr);color:var(--bg)}
.ans{display:grid;gap:8px;margin:16px 0}
.ans button{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:10px 12px;min-height:52px;align-items:start}
.ans .n{width:28px;height:28px;border-radius:50%;background:var(--blue2);display:grid;place-items:center;font-weight:700;font-size:14px}
.ans .fr{display:block;font-size:15px;margin-top:3px}
.ans button.ok{border-color:var(--grn);background:var(--grnbg)}.ans button.ok .n{background:var(--grn);color:#fff}
.ans button.ko{border-color:var(--red);background:var(--redbg)}.ans button.ko .n{background:var(--red);color:#fff}
.ans button:disabled{cursor:default}
.tip{border-left:4px solid var(--blue);background:var(--blue2);padding:12px 14px;border-radius:0 10px 10px 0;font-size:15px}
.tip p{margin:0 0 8px}.tip p:last-child{margin:0}
.tip button{background:none;border:1.5px solid var(--fr);color:var(--fr);border-radius:8px;min-height:36px;padding:0 10px;font-size:14px}
.kw{margin-top:18px;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.kw h3{margin:0;padding:10px 14px;background:var(--yel);font:700 17px "PT Sans Narrow",sans-serif}
.kw ul{list-style:none;margin:0;padding:4px 14px}
.kw li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.kw li:last-child{border:0}
.kw li b{font-weight:700}.kw li span{color:var(--fr)}
.vq{padding:12px 14px;border-top:2px solid var(--line)}
.vq p{margin:0 0 8px}
.vq .opts{display:grid;gap:6px}
.vq .opts button{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px 12px;min-height:44px}
.vq .opts button.ok{border-color:var(--grn);background:var(--grnbg)}.vq .opts button.ko{border-color:var(--red);background:var(--redbg)}
.nav{display:flex;gap:10px;margin-top:16px}.nav .btn{flex:1}
.note{font-size:14px;color:var(--mut);margin:10px 0}
.res{text-align:center;padding:20px 0}
.res b{font:700 64px/1 "PT Sans Narrow",sans-serif;display:block}
.res .pass{color:var(--grn)}.res .fail{color:var(--red)}
.search{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-height:46px;margin-bottom:10px}
.lex li{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}
.lex li small{color:var(--mut)}

.card0{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:12px 0 16px}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin:4px 0 2px}.bar i{display:block;height:100%;border-radius:6px;background:#3b82f6}
.brow{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:17px}.brow span:last-child{font-variant-numeric:tabular-nums}
.bars2{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 14px}
.tile{position:relative;overflow:hidden;border:0;border-radius:22px;aspect-ratio:1/1;max-height:240px;width:100%;padding:14px 16px;text-align:left;color:#fff;background:var(--c);box-shadow:0 4px 0 rgba(0,0,0,.12);display:flex;flex-direction:column}
.tile b{font:700 clamp(22px,6vw,30px)/1.05 "PT Sans Narrow",sans-serif;position:relative;z-index:1}
.tile small{font-size:13px;line-height:1.25;margin-top:3px;opacity:.92;position:relative;z-index:1;max-width:80%}
.tile svg{position:absolute;right:-3%;bottom:-3%;width:56%;height:auto}
.tile:active{transform:scale(.97)}
.rows{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 14px;text-align:left;min-height:62px}
.row:last-child{border-bottom:0}.row svg{width:40px;height:40px;flex:none}
.row b{display:block;font-size:17px}.row span{flex:1}.row small{color:var(--mut);font-size:13px;display:block}
.ru{display:block;font-style:normal;font-size:13px;line-height:1.2;opacity:.85}.brow .ru{font-weight:400;color:var(--mut)}.tile .ru{font-size:15px;font-weight:700;opacity:.9;position:relative;z-index:1}.row .ru{color:var(--fr);font-weight:700}.row::after{content:"›";font-size:26px;color:var(--mut)}
@media(prefers-reduced-motion:no-preference){.tile svg{animation:bob 3.2s ease-in-out infinite}.tile:nth-child(2) svg{animation-delay:-.8s}.tile:nth-child(3) svg{animation-delay:-1.6s}.tile:nth-child(4) svg{animation-delay:-2.4s}
 @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-2deg)}}
 .lamp{animation:blink 2.4s steps(1) infinite}@keyframes blink{50%{opacity:.35}}.tile{transition:transform .1s}}
@media(max-width:600px){.modes{grid-template-columns:minmax(0,1fr)}.q{font-size:18px}}
@media(prefers-reduced-motion:no-preference){.ans button,.vq button{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<header class="top">
  <button class="plate" id="home">ПДД 2026</button>
  <span class="sp"></span>
  <button class="tbtn" id="lexbtn">Lexique</button>
</header>
<main id="app"><p class="note">Chargement des 800 questions…</p></main>
<script>
{
const $=s=>document.querySelector(s), app=$('#app');
const TOP={"Дорожные знаки":"Panneaux de signalisation","Проезд перекрестков":"Passage des intersections","Начало движения, маневрирование":"Démarrage et manœuvres","Безопасность движения и техника управления автомобилем":"Sécurité et technique de conduite","Остановка и стоянка":"Arrêt et stationnement","Дорожная разметка":"Marquage au sol","Обгон, опережение, встречный разъезд":"Dépassement, devancement, croisement","Сигналы светофора и регулировщика":"Feux et signaux de l'agent","Расположение транспортных средств на проезжей части":"Position sur la chaussée","Неисправности и условия допуска транспортных средств к эксплуатации":"Pannes et conditions d'utilisation","Общие положения":"Dispositions générales","Пользование внешними световыми приборами и звуковыми сигналами":"Feux et klaxon","Скорость движения":"Vitesse","Оказание доврачебной медицинской помощи":"Premiers secours","Ответственность водителя":"Responsabilité du conducteur","Общие обязанности водителей":"Obligations du conducteur","Движение по автомагистралям":"Autoroutes","Движение через железнодорожные пути":"Passages à niveau","Применение специальных сигналов":"Véhicules prioritaires","Применение аварийной сигнализации и знака аварийной остановки":"Feux de détresse et triangle","Буксировка механических транспортных средств":"Remorquage","Движение в жилых зонах":"Zones résidentielles","Перевозка людей и грузов":"Transport de personnes et de chargements","Приоритет маршрутных транспортных средств":"Priorité des transports en commun","Учебная езда и дополнительные требования к движению велосипедистов":"Apprentissage et cyclistes","Пешеходные переходы и места остановок маршрутных транспортных средств":"Passages piétons et arrêts de bus"};
let Q=[], G=[], IMG={}, HF={}, st={r:{},tk:{},v:{},p:{}}, db=null, sample=null, uid=null, S=null, tick=null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>{const tk={};for(const[t,x]of Object.entries(s.tk||{}))tk[t]=x.n?x:{n:1,last:x.e,best:x.e,d:x.d};return{r:{...s.r},tk,v:{...(s.v||{})},p:{...(s.p||{})}}};
try{const s=JSON.parse(localStorage.getItem('pdd-st')||'null');if(s&&s.r)st=norm(s)}catch(e){}

/* ---------- sauvegarde ---------- */
let saveT=null,saving=false;
function save(){try{localStorage.setItem('pdd-st',JSON.stringify(st))}catch(e){}
  clearTimeout(saveT);saveT=setTimeout(async()=>{if(!db||!uid||saving)return;saving=true;try{await db.doc('data/users/'+uid+'/state').set(st)}catch(e){}saving=false},1500)}

/* ---------- images ---------- */
const imgP={};
function loadImg(t){if(!imgP[t])imgP[t]=fetch('shards/t'+t+'.json').then(r=>r.json()).then(d=>{IMG[t]=d;if(S&&S.view==='quiz'&&!S.done&&Q[S.list[S.i]].t===t)renderQuiz()}).catch(()=>{delete imgP[t]});return imgP[t]}

/* ---------- explication en français (Claude, à la demande) ---------- */
async function trTip(k){
  const q=Q[k];S.tipBusy=true;S.tipErr='';renderQuiz();
  try{
    const r=await sample(`Traduis en français cette explication du code de la route russe (ПДД РФ). Traduction fidèle et complète, vocabulaire du code de la route français (обгон = dépassement, опережение = devancement, уступить дорогу = céder le passage, проезжая часть = chaussée). Garde les numéros de panneaux, de marquage et de points tels quels. Réponds uniquement par la traduction.\n\n${q.h}`,{modelTier:'default'});
    const t=(r.text||'').trim();if(!t)throw{code:'empty'};
    HF[k]=t;try{await db.doc('fh/q'+k).set({t})}catch(e){}
  }catch(e){S.tipErr=e.code==='not_granted'?'Traduction refusée dans cette vue.':e.code==='rate_limited'?'Limite atteinte, réessaie plus tard.':'La traduction a échoué.'}
  S.tipBusy=false;renderQuiz();
}

/* ---------- vues ---------- */
const ILL={
exam:`<svg viewBox="0 0 120 130" aria-hidden="true"><rect x="55" y="80" width="10" height="50" fill="#9aa3ad"/><circle cx="60" cy="56" r="50" fill="#fff"/><circle cx="60" cy="56" r="46" fill="#e23b32"/><circle cx="60" cy="56" r="33" fill="#fff"/><text x="60" y="71" text-anchor="middle" font-family="PT Sans Narrow,Arial Narrow,sans-serif" font-weight="700" font-size="42" fill="#1a1a1a">60</text></svg>`,
tickets:`<svg viewBox="0 0 120 120" aria-hidden="true"><g stroke="rgba(0,0,0,.15)"><rect x="18" y="92" width="88" height="18" rx="3" fill="#2f6f7e"/><rect x="24" y="96" width="80" height="10" fill="#f3e9cf"/><rect x="12" y="74" width="92" height="18" rx="3" fill="#8a3b3b"/><rect x="18" y="78" width="84" height="10" fill="#f3e9cf"/><rect x="22" y="56" width="84" height="18" rx="3" fill="#3d5f8a"/><rect x="28" y="60" width="76" height="10" fill="#f3e9cf"/><rect x="14" y="38" width="88" height="18" rx="3" fill="#b07a3a"/><rect x="20" y="42" width="80" height="10" fill="#f3e9cf"/><rect x="26" y="20" width="76" height="18" rx="3" fill="#4f8a5b" transform="rotate(-6 64 29)"/></g><text x="62" y="34" font-family="PT Sans Narrow,sans-serif" font-weight="700" font-size="11" fill="#fff" transform="rotate(-6 64 29)" text-anchor="middle">ПДД</text></svg>`,
topics:`<svg viewBox="0 0 120 140" aria-hidden="true"><rect x="54" y="96" width="12" height="44" fill="#5b636b"/><rect x="36" y="6" width="48" height="96" rx="12" fill="#2b2f33"/><circle cx="60" cy="28" r="12" fill="#5a1c1c"/><circle cx="60" cy="54" r="12" fill="#5a4a14"/><circle class="lamp" cx="60" cy="80" r="12" fill="#3ee06b"/><circle cx="56" cy="76" r="3" fill="#c9ffd6"/></svg>`,
errors:`<svg viewBox="0 0 120 120" aria-hidden="true"><rect x="22" y="16" width="72" height="92" rx="6" fill="#fff" transform="rotate(6 58 62)"/><g transform="rotate(6 58 62)" stroke="#c7d3e6" stroke-width="3"><line x1="32" y1="38" x2="84" y2="38"/><line x1="32" y1="52" x2="84" y2="52"/><line x1="32" y1="66" x2="84" y2="66"/><line x1="32" y1="80" x2="70" y2="80"/></g><g stroke="#d7261e" stroke-width="8" stroke-linecap="round" transform="rotate(6 58 62)"><line x1="44" y1="46" x2="72" y2="74"/><line x1="72" y1="46" x2="44" y2="74"/></g><g transform="rotate(40 92 70)"><rect x="86" y="30" width="12" height="62" rx="2" fill="#f2b705"/><polygon points="86,92 98,92 92,106" fill="#f1d3a1"/><rect x="86" y="26" width="12" height="7" fill="#e88"/></g></svg>`,
texam:`<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="16" r="12" fill="#f2b705"/><circle cx="20" cy="16" r="8" fill="#ffd54a"/><path d="M14 26 10 38l10-5 10 5-4-12" fill="#3b82f6"/><text x="20" y="20" text-anchor="middle" font-size="10" font-weight="700" fill="#8a5a00">★</text></svg>`,
vocab:`<svg viewBox="0 0 40 40" aria-hidden="true"><rect x="2" y="4" width="24" height="18" rx="5" fill="#1b4f9c"/><path d="M8 22v6l6-6" fill="#1b4f9c"/><text x="14" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Аа</text><rect x="16" y="16" width="22" height="16" rx="5" fill="#e23b32"/><path d="M32 32v5l-5-5" fill="#e23b32"/><text x="27" y="28" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">Fr</text></svg>`,
marathon:`<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M14 38 18 4h4l4 34z" fill="#5b636b"/><g stroke="#fff" stroke-width="1.6"><line x1="20" y1="8" x2="20" y2="12"/><line x1="20" y1="17" x2="20" y2="22"/><line x1="20" y1="27" x2="20" y2="33"/></g><line x1="31" y1="6" x2="31" y2="24" stroke="#444" stroke-width="2"/><path d="M31 6h8v6h-8z" fill="#1f8a3b"/></svg>`,
lexique:`<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M3 9c6-3 11-3 17 1v24c-6-4-11-4-17-1z" fill="#3b82f6"/><path d="M37 9c-6-3-11-3-17 1v24c6-4 11-4 17-1z" fill="#60a5fa"/><path d="M20 10v24" stroke="#fff" stroke-width="1.5"/></svg>`,
reset:`<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M30 13a12 12 0 1 0 2 12" fill="none" stroke="#9aa3ad" stroke-width="4" stroke-linecap="round"/><path d="M24 6l9 5-9 5z" fill="#9aa3ad"/></svg>`};
const stats=()=>{const v=Object.values(st.r);return{seen:v.length,ok:v.filter(x=>x===1).length,pass:Object.values(st.tk).filter(x=>x.last===0).length}};
let flashMsg='';
const render={
home(){S={view:'home'};const s=stats(),vk=Object.keys(st.v).length;
  const err=Object.values(st.r).filter(x=>x===0).length,pct=(a,b)=>Math.round(a/b*100);

  <div class="tiles">
   ${tile('exam','#7c83e6','Examen','Экзамен','Comme au ГИБДД','exam')}
   ${tile('tickets','#4f9f72','Billets','Билеты','40 billets de 20 questions','tickets')}
   ${tile('topics','#4b9be8','Thèmes','Темы',Object.keys(TOP).length+' thèmes à réviser','topics')}
   ${tile('errors','#e07a74','Erreurs ('+err+')','Ошибки',err?'À revoir':'Aucune pour l\'instant','errors')}
  </div>
  <div class="rows">
   ${row('texam','texam','Examen par thème','Экзамен по темам','Panneaux, premiers secours, légal…')}

   ${row('marathon','marathon','Marathon','Марафон','Les 800 questions mélangées')}
   ${row('lexique','lexique','Lexique RU → FR','Словарь','Tous les mots-clés')}
   ${row('reset','reset','Remettre à zéro','Сбросить прогресс','Efface la progression')}
  </div>`;
  if(window.offStat)offStat();
  app.querySelectorAll('[data-rt]').forEach(b=>b.onclick=()=>startTicket(+b.dataset.rt,'ticket'));
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const g=b.dataset.go;flashMsg='';
    if(g==='exam')startExam();
    else if(g==='marathon')startList(shuffle(Q.map((_,k)=>k)),'Marathon','free');
    else if(g==='errors'){const l=Object.keys(st.r).filter(k=>st.r[k]===0).map(Number);if(l.length)startList(l,'Mes erreurs','free');else{flashMsg='Aucune erreur enregistrée pour l\'instant.';render.home()}}
    else if(g==='vocab')startVocab();
    else if(g==='reset'){if(b.dataset.c){st={r:{},tk:{},v:{},p:{}};save();render.home()}else{b.dataset.c=1;b.querySelector('small').textContent='Touche encore pour confirmer'}}
    else render[g]()})},
tickets(){S={view:'tickets'};
  app.innerHTML=`<h1>Billets</h1>
  <p class="legend"><span style="--c:#e07b00">Commencé, à terminer</span><span style="--c:var(--grn)">Dernier passage sans faute</span><span style="--c:var(--red)">Dernier passage avec fautes</span></p>
  <p class="sub">En haut à droite : nombre de fois terminé. En bas : dernier résultat, ou nombre de questions faites si le billet est en cours.</p>
  <div class="grid">${Array.from({length:40},(_,i)=>{const t=i+1,r=st.tk[t],p=st.p[t];const cls=p?'go':r?(r.last===0?'ok':'ko'):'';const low=p?`${Object.keys(p.ans).length}/20`:r?`${20-r.last}/20`:'';return`<button class="tk ${cls}" data-t="${t}" aria-label="Billet ${t}">${r?`<i>×${r.n}</i>`:''}${t}${low?`<small>${low}</small>`:''}</button>`}).join('')}</div>`;
  app.querySelectorAll('.tk').forEach(b=>b.onclick=()=>startTicket(+b.dataset.t,'ticket'))},
topics(){S={view:'topics'};const c={};Q.forEach((q,k)=>q.p.forEach(p=>(c[p]=c[p]||[]).push(k)));
  app.innerHTML=`<h1>Par thème</h1><div class="list">${Object.keys(TOP).filter(p=>c[p]).map(p=>`<button data-p="${esc(p)}"><span>${esc(p)}<br><span class="fr" style="font-size:14px">${esc(TOP[p])}</span></span><small>${c[p].length} q.</small></button>`).join('')}</div>`;
  app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>startList(c[b.dataset.p],TOP[b.dataset.p],'free'))},
texam(){S={view:'texam'};const c={};Q.forEach((q,k)=>q.p.forEach(p=>(c[p]=c[p]||[]).push(k)));
  const pool=ps=>[...new Set(ps.flatMap(p=>c[p]||[]))];
  const item=(i,name,sub,n)=>`<button data-x="${i}"><span>${esc(name)}${sub?`<br><span class="fr" style="font-size:14px">${esc(sub)}</span>`:''}</span><small>${n} q.</small></button>`;

  <h2>Regroupements</h2><div class="list">${TEX.map((x,i)=>item('g'+i,x[0],x[1].join(' · '),pool(x[1]).length)).join('')}</div>
  <h2>Thèmes officiels</h2><div class="list">${th.map((p,i)=>item('t'+i,p,TOP[p],c[p].length)).join('')}</div>`;
  app.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{const x=b.dataset.x,i=+x.slice(1);
    if(x[0]==='g')startThemeExam(pool(TEX[i][1]),TEX[i][0]);else startThemeExam(c[th[i]],TOP[th[i]])})},
lexique(){S={view:'lexique'};
  app.innerHTML=`<h1>Lexique de la route</h1><p class="sub">${G.length} mots-clés tirés des questions. Le chiffre indique dans combien de questions le mot apparaît.</p>

  const n=G.map(()=>0);Q.forEach(q=>q.k.forEach(i=>n[i]++));
  const order=G.map((_,i)=>i).sort((a,b)=>G[a][0].localeCompare(G[b][0],'ru'));

  $('#lq').oninput=draw;draw()}
};
function startTicket(t,mode){startList(Q.map((q,k)=>q.t===t?k:-1).filter(k=>k>=0),(mode==='exam'?'Examen · ':'')+'Billet '+t,mode,t);
  const p=mode==='ticket'&&st.p[t];
  if(p){S.ans={...p.ans};const n=S.list.findIndex(x=>S.ans[x]===undefined);S.i=n<0?S.list.length-1:n;S.resumed=true;renderQuiz()}}
function startList(list,title,mode,t){S={view:'quiz',list,title,mode,t,i:0,ans:{},fr:false,vq:null,end:mode==='exam'?Date.now()+20*60e3:0,done:false};renderQuiz();scrollTo(0,0)}

/* ---------- examen façon ГИБДД ----------
   20 questions en 4 blocs de 5. Une faute dans un bloc : +5 questions du même bloc (même groupe de thèmes) et +5 min.
   Échec : 2 fautes dans le même bloc, 3 fautes dans les 20 questions, ou une faute dans les questions supplémentaires. */
const GRP=['Panneaux, marquage, dispositions générales','Manœuvres, feux et agent, vitesse','Intersections, dépassement, arrêt et stationnement','Sécurité, premiers secours, responsabilité, équipement'];
const TEX=[['Panneaux et marquage',['Дорожные знаки','Дорожная разметка']],
 ['Santé : premiers secours',['Оказание доврачебной медицинской помощи']],
 ['Légal et administratif',['Ответственность водителя','Общие обязанности водителей','Общие положения']],
 ['Véhicule : pannes, feux, remorquage',['Неисправности и условия допуска транспортных средств к эксплуатации','Пользование внешними световыми приборами и звуковыми сигналами','Буксировка механических транспортных средств','Перевозка людей и грузов']],
 ['Intersections, feux et agent',['Проезд перекрестков','Сигналы светофора и регулировщика']],
 ['Manœuvres, dépassement, stationnement',['Начало движения, маневрирование','Обгон, опережение, встречный разъезд','Остановка и стоянка','Расположение транспортных средств на проезжей части']]];
function runExam(title,blocks,src,names){
  const list=[],bk={};blocks.forEach((b,i)=>b.forEach(k=>{list.push(k);bk[k]=i}));
  S={view:'quiz',list,title,mode:'exam',i:0,ans:{},fr:false,vq:null,end:Date.now()+list.length*60e3,done:false,
     ex:{bk,extra:{},got:{},src,names,nb:blocks.length,fail:'',msg:''}};renderQuiz();scrollTo(0,0)}
function startExam(){const used=[new Set(),new Set(),new Set(),new Set()];
  const src=g=>{const free=[...Array(40).keys()].map(i=>i+1).filter(t=>!used[g].has(t));if(!free.length)return[];const t=free[Math.random()*free.length|0];used[g].add(t);
    return Q.map((q,k)=>q.t===t&&((q.n-1)/5|0)===g?k:-1).filter(k=>k>=0).sort((a,b)=>Q[a].n-Q[b].n)};
  runExam('Examen blanc',[0,1,2,3].map(src),src,GRP)}
function startThemeExam(pool,name){const left=shuffle(pool.slice());const src=()=>left.splice(0,5);
  const L=left.length,n=L<10?1:Math.min(4,Math.floor((L-5)/5)),blocks=[];for(let i=0;i<n;i++)blocks.push(src());
  runExam('Examen · '+name,blocks,src,blocks.map((_,i)=>name+' · bloc '+(i+1)))}
function examAnswer(k){const E=S.ex,wrong=x=>S.ans[x]!==undefined&&S.ans[x]!==Q[x].c;E.msg='';
  if(!wrong(k))return;
  if(k in E.extra){E.fail='Faute dans les questions supplémentaires.';return}
  const b=E.bk[k],main=S.list.filter(x=>!(x in E.extra));
  if(main.filter(x=>E.bk[x]===b&&wrong(x)).length>=2){E.fail='2 fautes dans le même bloc ('+E.names[b]+').';return}
  if(main.filter(wrong).length>2){E.fail='3 fautes dans les questions principales.';return}
  if(E.got[b])return;E.got[b]=1;
  const add=E.src(b).filter(x=>!S.list.includes(x));
  if(!add.length){E.fail='Faute sans question supplémentaire disponible dans ce thème.';return}
  add.forEach(x=>{S.list.push(x);E.extra[x]=b;E.bk[x]=b});S.end+=add.length*60e3;
  E.msg='Faute dans le bloc « '+E.names[b]+' » : '+add.length+' questions supplémentaires (n° '+(S.list.length-add.length+1)+' à '+S.list.length+') et '+add.length+' minutes ajoutées. Aucune faute permise sur ces questions.'}

/* mini-quiz de vocabulaire */
function makeVq(gi){const others=shuffle(G.map((_,i)=>i).filter(i=>i!==gi&&G[i][1]!==G[gi][1])).slice(0,2);return{gi,opts:shuffle([gi,...others]),pick:null}}
function vqHtml(v){return`<div class="vq"><p>Que veut dire <b>« ${esc(G[v.gi][0])} »</b> ?</p><div class="opts">${v.opts.map(o=>`<button data-o="${o}" class="${v.pick===null?'':o===v.gi?'ok':o===v.pick?'ko':''}" ${v.pick!==null?'disabled':''}>${esc(G[o][1])}</button>`).join('')}</div></div>`}
function pickVq(v,o){if(v.pick!==null)return;v.pick=o;st.v[v.gi]=o===v.gi?1:0;save()}

function renderQuiz(){
  clearInterval(tick);
  if(S.done)return renderResult();
  const k=S.list[S.i],q=Q[k],a=S.ans[k],exam=S.mode==='exam',fr=S.fr;
  const strip=S.list.length<=40?`<div class="strip">${S.list.map((x,i)=>`<button data-i="${i}" class="${i===S.i?'cur ':''}${S.ans[x]!==undefined?(S.ans[x]===Q[x].c?'ok':'ko'):''}">${i+1}</button>`).join('')}</div>`:'';
  const fails=S.list.filter(x=>S.ans[x]!==undefined&&S.ans[x]!==Q[x].c).length;
  if(a!==undefined&&!exam&&q.k.length&&!S.vq)S.vq=makeVq(q.k[Math.random()*Math.min(q.k.length,3)|0]);
  const hf=q.fh||HF[k];
  app.innerHTML=`<div class="qhead"><span class="t">${esc(S.title)} · ${S.i+1}/${S.list.length}</span>${exam?`<span class="timer" id="tm"></span><span style="color:${fails?'var(--red)':'var(--mut)'};font-size:14px">${fails} faute(s)</span>`:`<span style="color:var(--mut);font-size:14px">Billet ${q.t}, q. ${q.n}</span>`}</div>
  ${S.resumed?`<p class="note" style="margin-top:0">Billet repris là où tu l'avais laissé. <button class="tbtn" style="color:var(--fr);border-color:var(--fr);min-height:32px" id="restart">Recommencer à zéro</button></p>`:''}
  ${S.ex&&S.ex.msg?`<p class="note" style="color:#e07b00;font-weight:700">${esc(S.ex.msg)}</p>`:''}
  ${strip}
  ${q.i?`<div class="pic">${IMG[q.t]?`<img src="${IMG[q.t][q.i]}" alt="Situation de la question ${q.n}">`:''}</div>`:''}
  <p class="q">${esc(q.q)}</p>
  ${fr?`<p class="fr qfr">${esc(q.fq)}</p>`:''}
  <button class="frbtn" id="frb" aria-pressed="${fr}">${fr?'Masquer le français':'Voir en français'}</button>
  <div class="ans">${q.a.map((x,j)=>{const cls=a===undefined?'':j===q.c?'ok':j===a?'ko':'';return`<button data-j="${j}" class="${cls}" ${a!==undefined?'disabled':''}><span class="n">${j+1}</span><span>${esc(x)}${fr?`<span class="fr">${esc(q.fa[j])}</span>`:''}</span></button>`}).join('')}</div>
  ${a!==undefined&&!exam?`<div class="tip"><p>${esc(q.h)}</p>${hf?(fr?`<p class="fr">${esc(hf)}</p>`:`<p><button class="tbtn" id="tipfr" style="color:var(--fr);border-color:var(--fr);min-height:36px">Voir l'explication en français</button></p>`):S.tipBusy?'<p class="fr">Traduction en cours…</p>':sample?`<p><button id="tipb">Traduire l'explication</button>${S.tipErr?` <span style="color:var(--red);font-size:14px">${esc(S.tipErr)}</span>`:''}</p>`:''}</div>`:''}
  ${a!==undefined&&!exam&&q.k.length?`<div class="kw"><h3>Mots-clés de la question</h3><ul>${q.k.map(i=>`<li><b>${esc(G[i][0])}</b><span>${esc(G[i][1])}</span></li>`).join('')}</ul>${vqHtml(S.vq)}</div>`:''}
  <div class="nav"><button class="btn ghost" id="prev" ${S.i?'':'disabled'}>Précédente</button><button class="btn" id="next">${S.i===S.list.length-1?'Terminer':'Suivante'}</button></div>
  ${exam&&S.ex?`<p class="note">Bloc : ${esc(S.ex.names[S.ex.bk[k]])}${k in S.ex.extra?' · question supplémentaire':''}. Une faute ajoute 5 questions du même bloc ; 2 fautes dans un bloc, 3 fautes au total ou une faute dans les questions supplémentaires = échec. Les mots-clés et explications s'affichent à la fin, dans « Revoir mes fautes ».</p>`:''}`;
  if(q.i&&!IMG[q.t])loadImg(q.t);
  const rs=$('#restart');if(rs)rs.onclick=()=>{delete st.p[S.t];save();startTicket(S.t,'ticket')};
  $('#frb').onclick=()=>{S.fr=!S.fr;renderQuiz()};
  const tf=$('#tipfr');if(tf)tf.onclick=()=>{S.fr=true;renderQuiz()};
  app.querySelectorAll('.ans button').forEach(b=>b.onclick=()=>answer(k,+b.dataset.j));
  app.querySelectorAll('.vq button').forEach(b=>b.onclick=()=>{pickVq(S.vq,+b.dataset.o);renderQuiz()});
  {const sp=app.querySelector('.strip'),cb=sp&&sp.querySelector('.cur');if(cb)sp.scrollLeft=cb.offsetLeft-sp.offsetLeft-(sp.clientWidth-cb.offsetWidth)/2}
  app.querySelectorAll('.strip button').forEach(b=>b.onclick=()=>go(+b.dataset.i));
  const tb=$('#tipb');if(tb)tb.onclick=()=>trTip(k);
  $('#prev').onclick=()=>go(S.i-1);
  $('#next').onclick=()=>{if(S.i<S.list.length-1)go(S.i+1);else finish()};
  if(exam){const tm=$('#tm'),up=()=>{const r=Math.max(0,S.end-Date.now());tm.textContent=Math.floor(r/60e3)+':'+String(Math.floor(r/1e3)%60).padStart(2,'0');if(!r)finish()};up();tick=setInterval(up,1000)}
  if(db&&!(k in HF)&&a!==undefined&&!exam){HF[k]=undefined;db.doc('fh/q'+k).get().then(s=>{if(s.exists&&s.data().t){HF[k]=String(s.data().t);if(S.view==='quiz'&&S.list[S.i]===k)renderQuiz()}}).catch(()=>{})}
}
function go(i){S.i=i;S.fr=false;S.vq=null;S.tipErr='';renderQuiz();scrollTo(0,0)}
function answer(k,j){if(S.ans[k]!==undefined)return;S.ans[k]=j;st.r[k]=j===Q[k].c?1:0;if(S.mode==='ticket'&&S.t)st.p[S.t]={ans:{...S.ans},d:Date.now()};save();
  if(S.ex){examAnswer(k);if(S.ex.fail)return finish()}
  renderQuiz()}
function finish(){if(S.done)return;S.done=true;clearInterval(tick);
  if(S.t&&S.mode!=='free'){const e=S.list.filter(x=>S.ans[x]!==Q[x].c).length,o=st.tk[S.t];st.tk[S.t]={n:(o?o.n:0)+1,last:e,best:o?Math.min(o.best,e):e,d:Date.now()};if(S.mode==='ticket')delete st.p[S.t];save()}
  renderResult()}
function renderResult(){
  const ok=S.list.filter(x=>S.ans[x]===Q[x].c).length,bad=S.list.filter(x=>S.ans[x]!==undefined&&S.ans[x]!==Q[x].c),skip=S.list.filter(x=>S.ans[x]===undefined).length;
  const E=S.ex;if(E&&!E.fail&&skip)E.fail=skip+' question(s) sans réponse (comptées comme fautes).';
  const pass=E?!E.fail:S.t?bad.length+skip<=2:null;
  app.innerHTML=`<div class="res"><p class="sub">${esc(S.title)}</p><b class="${pass===null?'':pass?'pass':'fail'}">${ok}/${S.list.length}</b>
  <p style="font-size:20px;font-weight:700">${pass===null?'Série terminée':ok===S.list.length?'Sans faute':pass?(E?'Réussi':'Réussi, avec '+(S.list.length-ok)+' faute(s)'):'Échoué'}</p>${S.t&&st.tk[S.t]?`<p class="sub">Billet ${S.t} terminé ${st.tk[S.t].n} fois · meilleur résultat : ${20-st.tk[S.t].best}/20</p>`:''}${skip&&!E?`<p class="sub">${skip} question(s) sans réponse</p>`:''}${E&&E.fail?`<p class="sub" style="color:var(--red)">${esc(E.fail)}</p>`:''}${E?`<div class="kw" style="text-align:left"><ul>${E.names.slice(0,E.nb).map((nm,b)=>{const qs=S.list.filter(x=>E.bk[x]===b&&!(x in E.extra)),xs=S.list.filter(x=>E.extra[x]===b);const f=a=>a.filter(x=>S.ans[x]===Q[x].c).length;return`<li><b>${esc(nm)}</b><span>${f(qs)}/${qs.length}${xs.length?` · supplémentaires ${f(xs)}/${xs.length}`:''}</span></li>`}).join('')}</ul></div>`:''}</div>
  <div class="nav">${bad.length?'<button class="btn" id="rev">Revoir mes fautes</button>':''}<button class="btn ghost" id="back">Accueil</button></div>`;
  $('#back').onclick=render.home;const r=$('#rev');if(r)r.onclick=()=>startList(bad,'Fautes · '+S.title,'free');
}

/* quiz de vocabulaire seul : 10 mots, priorité aux mots ratés ou jamais vus */
function startVocab(){
  const w=G.map((_,i)=>i).sort((a,b)=>((st.v[a]??0.5)-(st.v[b]??0.5))||Math.random()-.5);
  S={view:'vocab',list:shuffle(w.slice(0,25)).slice(0,10).map(makeVq),i:0};renderVocab()}
function renderVocab(){
  if(S.i>=S.list.length){const ok=S.list.filter(v=>v.pick===v.gi).length;
    app.innerHTML=`<div class="res"><p class="sub">Quiz de vocabulaire</p><b class="${ok>=8?'pass':'fail'}">${ok}/10</b></div><div class="kw"><ul>${S.list.map(v=>`<li><b>${esc(G[v.gi][0])}</b><span>${esc(G[v.gi][1])}</span></li>`).join('')}</ul></div><div class="nav"><button class="btn" id="again">Encore 10 mots</button><button class="btn ghost" id="back">Accueil</button></div>`;
    $('#again').onclick=startVocab;$('#back').onclick=render.home;return}
  const v=S.list[S.i];
  app.innerHTML=`<div class="qhead"><span class="t">Quiz de vocabulaire · ${S.i+1}/10</span></div><div class="kw" style="margin-top:0">${vqHtml(v)}</div><div class="nav"><button class="btn" id="next" ${v.pick===null?'disabled':''}>${S.i===9?'Voir le résultat':'Mot suivant'}</button></div>`;
  app.querySelectorAll('.vq button').forEach(b=>b.onclick=()=>{pickVq(v,+b.dataset.o);renderVocab()});
  $('#next').onclick=()=>{S.i++;renderVocab()};
}

$('#home').onclick=()=>{clearInterval(tick);render.home()};
$('#lexbtn').onclick=()=>{clearInterval(tick);render.lexique()};

/* ---------- démarrage ---------- */
Promise.all([fetch('q.json').then(r=>r.json()),fetch('g.json').then(r=>r.json())]).then(([d,g])=>{Q=d;G=g;render.home()}).catch(()=>{app.innerHTML='<p class="note">Impossible de charger les questions.</p>'});
if(window.claude&&claude.use){
  claude.use('sample').then(s=>{sample=s;if(S&&S.view==='quiz')renderQuiz()}).catch(()=>{});
  Promise.all([claude.use('db'),claude.use('user')]).then(async([d,u])=>{
    if(!d)return;db=d;
    try{uid=u&&await u.id()}catch(e){}
    if(uid){try{const s=await db.doc('data/users/'+uid+'/state').get();if(s.exists){const v=s.data();if(v&&v.r&&Object.keys(v.r).length>=Object.keys(st.r).length){st=norm(v);if(S&&S.view==='home')render.home()}}}catch(e){}}
  }).catch(()=>{});
}
}
</script>
<script>
{const N=48;
async function offStat(){const el=document.getElementById('offst');if(!el)return;
  if(!('serviceWorker' in navigator)||!window.caches){el.textContent='Hors ligne : non pris en charge par ce navigateur.';return}
  try{const c=await caches.open('pdd-offline'),n=(await c.keys()).length;
    if(n>=N){el.textContent='Hors ligne : prêt. Tu peux passer en mode avion.';el.style.color='var(--grn)'}
    else{el.textContent='Hors ligne : téléchargement '+n+'/'+N+'… garde l\'application ouverte avec Internet.';el.style.color='#e07b00';setTimeout(offStat,1500)}}catch(e){el.textContent=''}}
window.offStat=offStat;
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(()=>setTimeout(offStat,800)).catch(()=>{});
}
</script>
